<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4A1D3F" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" /><meta name="robots" content="noindex,nofollow" />
    <script>
      // Light by default; dark only if the person chose it. Runs before first paint so there is no flash.
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('mm_theme') === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <style>
      /* Shown by the browser until the app takes over, so there is never a blank page. */
      .mm-splash { min-height: 100vh; display: grid; place-items: center; background: #FBF7F2; background-image: radial-gradient(42% 36% at 80% 10%, rgb(242 163 58 / .16), transparent), radial-gradient(46% 40% at 10% 92%, rgb(226 114 91 / .14), transparent); }
      :root[data-theme='dark'] .mm-splash { background-color: #140D12; color: #E9DDE6; }
      .mm-splash-inner { display: grid; justify-items: center; gap: 28px; }
      .mm-splash-ring { position: relative; width: 112px; height: 112px; color: #E8DDD3; }
      :root[data-theme='dark'] .mm-splash-ring { color: #3A2A35; }
      .mm-splash-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .mm-arc { animation: mm-spin 1.4s linear infinite; }
      .mm-mark { inset: auto !important; left: 50%; top: 50%; width: 56px !important; height: 56px !important; transform: translate(-50%, -50%); animation: mm-pulse 2.2s ease-in-out infinite; }
      .mm-splash-text { margin: 0; font: 500 20px Georgia, 'Times New Roman', serif; color: #4A1D3F; letter-spacing: .02em; }
      :root[data-theme='dark'] .mm-splash-text { color: #E9C9DD; }
      @keyframes mm-spin { to { transform: rotate(360deg); } }
      @keyframes mm-pulse { 50% { opacity: .6; } }
      @media (prefers-reduced-motion: reduce) { .mm-arc, .mm-mark { animation: none; } }
    </style>
    <title>Marchmaker Admin</title>
  </head>
  <body>
    <div id="root">
      <div class="mm-splash" role="status" aria-live="polite">
        <div class="mm-splash-inner">
          <div class="mm-splash-ring">
            <svg viewBox="0 0 112 112" class="mm-track" aria-hidden="true"><circle cx="56" cy="56" r="50" fill="none" stroke="currentColor" stroke-width="3" /></svg>
            <svg viewBox="0 0 112 112" class="mm-arc" aria-hidden="true">
              <defs><linearGradient id="mm-sp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2A33A" /><stop offset="1" stop-color="#E2725B" /></linearGradient></defs>
              <circle cx="56" cy="56" r="50" fill="none" stroke="url(#mm-sp)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="78 236" />
            </svg>
            <svg viewBox="0 0 64 64" class="mm-mark" aria-hidden="true">
              <defs><linearGradient id="mm-spm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2A33A" /><stop offset="1" stop-color="#E2725B" /></linearGradient></defs>
              <rect width="64" height="64" rx="16" fill="#4A1D3F" />
              <path d="M18 44V22l14 14 14-14v22" fill="none" stroke="url(#mm-spm)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <p class="mm-splash-text">Loading</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
