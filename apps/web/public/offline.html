<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4A1D3F" />
    <title>You are offline | Marchmaker</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #fbf7f2; color: #2a1a28; display: grid; min-height: 100vh; place-items: center; padding: 24px; }
      main { max-width: 28rem; text-align: center; }
      h1 { color: #4a1d3f; font-size: 1.6rem; }
      button { min-height: 44px; padding: 0 24px; border-radius: 999px; border: 0; background: #4a1d3f; color: #fff; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Marchmaker needs a connection to show your introductions and messages. Please check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
